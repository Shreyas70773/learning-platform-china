# The Next.js Runtime wires App Router pages + route handlers (src/app/api/*)
# into serverless functions and provides the Netlify Blobs context. It MUST be
# declared explicitly here; otherwise Netlify publishes .next as static files
# and every route 404s.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Required environment variables (set in the Netlify dashboard, not here):
#   JWT_SECRET     — secret for signing login tokens
#   ADMIN_SECRET   — gates the admin add-user endpoint
# Netlify Blobs needs no token when deployed on Netlify; the context is injected.
